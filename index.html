<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GroceryGo — Coming soon</title>
  <meta name="description" content="Your magic compass for every store. GroceryGo is coming soon." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="GroceryGo — Coming soon" />
  <meta property="og:description" content="Your magic compass for every store." />
  <link rel="icon" href="/assets/groceryGo-logo.png" type="image/png" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0b0b0c;
      --muted: #5f6368;
      --rule: #e4e4e7;
      --logo-filter: none;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --rule: #27272a;
        --logo-filter: invert(1);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
    }
    .logo {
      width: min(360px, 72vw);
      height: auto;
      filter: var(--logo-filter);
    }
    .badge {
      margin-top: 8px;
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 1px solid var(--rule);
      border-radius: 999px;
    }
    h1 {
      margin: 24px 0 8px;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.1;
      letter-spacing: -.02em;
    }
    p {
      margin: 0;
      font-size: clamp(16px, 3vw, 19px);
      color: var(--muted);
    }
    footer {
      padding: 20px 16px 28px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/groceryGo-logo.png" alt="GroceryGo" width="640" height="349" />
    <span class="badge">Coming soon</span>
    <h1>Your magic compass for every store.</h1>
    <p>We're giving GroceryGo a fresh start. Check back soon.</p>
  </main>
  <footer>&copy; Get2</footer>
</body>
</html>
